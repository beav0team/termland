# kitty as a termland host: no tabs, no decorations, no scrollback.
#
# Install to ~/.config/termland/kitty.conf and launch with `tl`.
# Everything here exists to make kitty invisible, because termland is the
# window manager and kitty is only the surface it draws on.

# ── font ──────────────────────────────────────────────────────────────────────
font_family           JetBrainsMono Nerd Font
bold_font             auto
italic_font           auto
bold_italic_font      auto
font_size             11.5
adjust_line_height    100%
# A tiling WM is all about cells: keep the cell grid tight and predictable.
adjust_column_width   100%

# ── palette (Ant-Dark) ────────────────────────────────────────────────────────
background            #1e282c
foreground            #d8dee9
cursor                #9bbfb4
cursor_text_color     #1e282c
selection_background  #3a4c52
selection_foreground  #d8dee9
url_color             #9bbfb4

color0  #131718
color8  #4c566a
color1  #bf616a
color9  #d08770
color2  #a3be8c
color10 #b3c99c
color3  #ebcb8b
color11 #f0d399
color4  #81a1c1
color12 #9bbfb4
color5  #b48ead
color13 #c895c8
color6  #88c0d0
color14 #9fd3e0
color7  #d8dee9
color15 #eceff4

# ── window ────────────────────────────────────────────────────────────────────
hide_window_decorations  yes
window_padding_width     0
confirm_os_window_close  0
remember_window_size      no

# ── no chrome ─────────────────────────────────────────────────────────────────
tab_bar_style            hidden
tab_bar_edge             top
enable_audio_bell        no
visual_bell_duration     0
window_alert_on_bell     no
bell_on_tab              no
update_check_interval    0

# ── the terminal must not keep state termland owns ────────────────────────────
# Scrollback is the big one: kitty would store *rendered frames* of the whole
# tiled UI, and scrolling up would show a stale mosaic of every past layout.
scrollback_lines         0
mouse_hide_wait          2.0
copy_on_select           no

# termland draws its own cursor placement; let it.
cursor_shape             block
cursor_blink_interval    0

# Multiplexers and remote control fight over the same keys and graphics — off.
allow_remote_control     no
shell_integration        disabled
