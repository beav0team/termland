name: Bug report
description: File a bug about termland
title: "[bug] "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        **Before you file**: does this reproduce on `main`? termland is alpha (`v0.1`, host tier on kitty).
  - type: textarea
    attributes:
      label: What happened
      description: A clear and concise description of the bug.
    validations:
      required: true
  - type: textarea
    attributes:
      label: What you expected
      description: What you expected to happen instead.
    validations:
      required: true
  - type: textarea
    attributes:
      label: Steps to reproduce
      description: |
        1. Start termland with `tl`
        2. ...
        3. See error
    validations:
      required: true
  - type: textarea
    attributes:
      label: Environment
      value: |
        - Rust version: `rustc --version`
        - Terminal host: kitty / ghostty / WezTerm (and kitty.conf present?)
        - `tlc list` output, if relevant
    validations:
      required: true
